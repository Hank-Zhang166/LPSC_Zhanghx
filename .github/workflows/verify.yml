name: P9 research checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Recompute the historical ordering margins
        run: |
          python p9/evidence/ordering_robustness.py
          git diff --exit-code -- p9/evidence/ordering_margins.csv p9/evidence/ordering_stress.csv
      - name: Test the synthetic ranking model
        run: python -m unittest discover -s p9/ranking -p "test_*.py"
      - name: Replay the decision simulation
        run: python simulation/redesign/verify.py
      - name: Cross-check the published report and slides
        run: python p9/paper/verify_p9.py
