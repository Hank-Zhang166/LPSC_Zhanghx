   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="524.88" y="96.396562" transform="rotate(-0 524.88 96.396562)">执行事件 → 冻结 → 新批</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #08796d" x="383.76" y="135.97875" transform="rotate(-0 383.76 135.97875)">单步政策</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="524.88" y="135.996562" transform="rotate(-0 524.88 135.996562)">执行事件 → 冻结 → 新批</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #08796d" x="383.76" y="175.549688" transform="rotate(-0 383.76 175.549688)">条件两步</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="524.88" y="175.596563" transform="rotate(-0 524.88 175.596563)">执行事件 → 冻结 → 新批</text>
   </g>
   <g id="text_17">
