   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #526774" x="12.96" y="20.720312" transform="rotate(-0 12.96 20.720312)">竞争解释</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #526774" x="258.48" y="20.694062" transform="rotate(-0 258.48 20.694062)">最小的区分性观测</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #526774" x="511.2" y="20.776094" transform="rotate(-0 511.2 20.776094)">允许改变的对象</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="23.04" y="59.991016" transform="rotate(-0 23.04 59.991016)">物相或占位不相容</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="252" y="59.978828" transform="rotate(-0 252 59.978828)">物相复核／留出占位观测</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #285985" x="512.64" y="60.004219" transform="rotate(-0 512.64 60.004219)">支持集与结构权重</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="23.04" y="113.984922" transform="rotate(-0 23.04 113.984922)">短程迁移采样不足</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="252" y="114.016406" transform="rotate(-0 252 114.016406)">独立启动、有效跨笼跳跃</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #08796d" x="512.64" y="113.972734" transform="rotate(-0 512.64 113.972734)">轨迹长度与采样预算</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="23.04" y="167.971719" transform="rotate(-0 23.04 167.971719)">成形或测量异常</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="252" y="167.992031" transform="rotate(-0 252 167.992031)">同粉体分片／装夹复测</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #9d5425" x="512.64" y="167.984922" transform="rotate(-0 512.64 167.984922)">宏观映射与测量判断</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="23.04" y="221.953437" transform="rotate(-0 23.04 221.953437)">局域势造成可行动偏差</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="252" y="222.041797" transform="rotate(-0 252 222.041797)">同构型独立 DFT 力及相对能</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #715181" x="512.64" y="222.035703" transform="rotate(-0 512.64 222.035703)">补标、适配和独立验收</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172e3d" x="21.6" y="275.779844" transform="rotate(-0 21.6 275.779844)">多因可同时存在。</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12.2px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #526774" x="21.6" y="291.563344" transform="rotate(-0 21.6 291.563344)">只有独立原子参考支持、验收可做且发布赶得上冻结时，才提交定向训练。</text>
   </g>
  </g>
